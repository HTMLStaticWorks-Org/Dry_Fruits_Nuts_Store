<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldenHarvest - Product, Gift Box &amp; Bulk Enquiry</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="index.css">
  
  <!-- Tailwind CSS 3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              light: '#fdf8f3',
              dark: '#181009',
              primary: '#b45309',
              primaryHover: '#92400e',
              secondary: '#4d7c0f',
              secondaryHover: '#3f6212',
              accent: '#d97706',
              navy: '#2c1a0e',
            },
            slate: {
              50: '#fbf8f4',
              100: '#f5ede2',
              200: '#e8d7c3',
              300: '#d7bc9e',
              400: '#b89776',
              500: '#967353',
              600: '#78583c',
              700: '#5c412a',
              800: '#402c1b',
              850: '#2e1f12',
              900: '#22160c',
              950: '#140c06',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col relative">

  <!-- Floating Toggles -->
  <div class="absolute top-6 right-6 flex items-center space-x-3 rtl:space-x-reverse z-50">

    <!-- RTL Toggle -->
    <button class="rtl-toggle w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex items-center justify-center bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm" aria-label="Toggle Direction">
      <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
    </button>
    
    <!-- Theme Toggle -->
    <button class="theme-toggle w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors flex items-center justify-center bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm" aria-label="Toggle Theme">
      <i data-lucide="sun" class="sun-icon w-5 h-5 hidden"></i>
      <i data-lucide="moon" class="moon-icon w-5 h-5"></i>
    </button>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="flex-grow flex items-center justify-center py-20 relative bg-gradient-to-tr from-amber-50/50 via-white to-white dark:from-slate-900 dark:via-slate-950 dark:to-slate-950 min-h-screen">
    <div class="max-w-md w-full mx-auto px-4">
      <div class="glass-card p-8 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-800 text-left ltr:text-left rtl:text-right animate-fade-in-up">
        
        <div class="flex flex-col items-center mb-8">
          <!-- Logo -->
          <a href="index.html" class="flex items-center space-x-2.5 rtl:space-x-reverse group mb-6">
            <img src="favicon.svg" alt="GoldenHarvest Logo" class="w-11 h-11 rounded-xl shadow-md shadow-amber-950/20 group-hover:scale-105 transition-transform duration-300 flex-shrink-0">
            <div class="flex flex-col text-left ltr:text-left rtl:text-right">
              <span class="font-outfit text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-none">
                Golden<span class="text-brand-primary">Harvest</span>
              </span>
              <span class="text-[10px] font-bold uppercase tracking-wider text-amber-700 dark:text-amber-400 leading-tight mt-0.5">
                Dry Fruits &amp; Nuts Store
              </span>
            </div>
          </a>
          <h1 class="text-2xl sm:text-3xl font-extrabold font-outfit text-slate-900 dark:text-white text-center">Quick Order Enquiry</h1>
          <p class="text-xs text-slate-400 mt-1.5 font-normal text-center">Request custom pricing for premium dry fruits, bespoke gift boxes, or wholesale bulk orders.</p>
        </div>

        <form id="standalone-enquire-form" action="#" class="space-y-4">
          <div>
            <label for="name" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Full Name</label>
            <input type="text" id="name" required placeholder="Enter your full name" 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-transparent text-sm focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
          </div>

          <div>
            <label for="email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Email Address</label>
            <input type="email" id="email" required placeholder="your@email.com" 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-transparent text-sm focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
          </div>

          <div>
            <label for="phone" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Phone / WhatsApp Number</label>
            <input type="tel" id="phone" required placeholder="+1 (555) 234-5678" 
                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-transparent text-sm focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all">
          </div>

          <div>
            <label for="category" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Product Category</label>
            <select id="category" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-transparent text-sm focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary dark:text-slate-300 dark:bg-slate-900 transition-all">
              <option value="almonds" class="dark:bg-slate-900">Premium Almonds (Mamra, California, Marcona)</option>
              <option value="cashews" class="dark:bg-slate-900">Jumbo Cashews (W180 King, Peri-Peri, Herb)</option>
              <option value="dates" class="dark:bg-slate-900">Organic Dates (Royal Medjool, Madinah Ajwa)</option>
              <option value="mixes" class="dark:bg-slate-900">Artisan Trail Mixes &amp; Daily Wellness Packs</option>
              <option value="gift-boxes" class="dark:bg-slate-900">Luxury Velvet &amp; Rosewood Gift Boxes</option>
              <option value="bulk-orders" class="dark:bg-slate-900">Corporate Gifting &amp; Wholesale Bulk (10 kg+)</option>
            </select>
          </div>

          <div>
            <label for="quantity" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Estimated Quantity / Pack Size</label>
            <select id="quantity" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-transparent text-sm focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary dark:text-slate-300 dark:bg-slate-900 transition-all">
              <option value="retail-pack" class="dark:bg-slate-900">Retail Pantry Jars (500g – 2 kg)</option>
              <option value="family-crate" class="dark:bg-slate-900">Family Assortment Crate (3 kg – 9 kg)</option>
              <option value="gift-hampers" class="dark:bg-slate-900">Custom Gift Hampers (10 – 100 Boxes)</option>
              <option value="wholesale-bulk" class="dark:bg-slate-900">Commercial / Event Bulk (100+ Boxes / 25 kg+)</option>
            </select>
          </div>

          <div>
            <label for="notes" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Enquiry Details &amp; Custom Preferences</label>
            <textarea id="notes" rows="3" required placeholder="Tell us your preferred varieties, roast level (raw, dry-roasted, salted), custom branding needs, or delivery city..." 
                      class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-transparent text-sm focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all"></textarea>
          </div>

          <div class="flex items-center py-1 text-xs sm:text-sm font-medium">
            <label class="flex items-start space-x-2.5 rtl:space-x-reverse cursor-pointer">
              <input type="checkbox" required class="mt-0.5 w-4 h-4 rounded text-brand-primary border-slate-300 focus:ring-brand-primary focus:ring-0">
              <span class="text-slate-500 dark:text-slate-400 leading-normal">
                Send me the latest <a href="services.html" class="text-brand-primary hover:underline font-bold">Harvest Price List</a> &amp; <a href="blog.html" class="text-brand-primary hover:underline font-bold">Bulk Catalog</a>
              </span>
            </label>
          </div>

          <button type="submit" id="enquire-submit-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-primary to-brand-accent text-white font-semibold text-center shadow-lg shadow-amber-700/20 transition-all transform hover:-translate-y-0.5">
            Send Enquiry Now
          </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-5">
          <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Or connect directly via</span>
          <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
        </div>

        <!-- Direct Enquiry Channels -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <!-- Call Desk -->
          <a href="contact.html" aria-label="Call Harvest Desk" class="flex items-center justify-center gap-1.5 w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 transition-all duration-200 shadow-sm hover:shadow-md">
            <i data-lucide="phone-call" class="w-4 h-4 text-brand-primary flex-shrink-0"></i>
            <span>Call Desk</span>
          </a>

          <!-- Gift Catalog -->
          <a href="gallery.html" aria-label="Browse Gift Boxes" class="flex items-center justify-center gap-1.5 w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 transition-all duration-200 shadow-sm hover:shadow-md">
            <i data-lucide="gift" class="w-4 h-4 text-brand-primary flex-shrink-0"></i>
            <span>Gift Boxes</span>
          </a>

          <!-- Bulk Rates -->
          <a href="blog.html" aria-label="View Bulk Orders" class="flex items-center justify-center gap-1.5 w-full py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 transition-all duration-200 shadow-sm hover:shadow-md">
            <i data-lucide="boxes" class="w-4 h-4 text-brand-primary flex-shrink-0"></i>
            <span>Bulk Tier</span>
          </a>
        </div>

        <div class="mt-5 text-center text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400">
          Need store location &amp; hours? <a href="contact.html" class="text-brand-primary hover:text-brand-primaryHover font-bold">Visit Contact Page</a>
        </div>

      </div>
    </div>
  </main>

  <!-- ================= SCRIPTS ================= -->
  <script src="main.js"></script>
  <script>
    const enquireForm = document.getElementById('standalone-enquire-form');
    const submitBtn = document.getElementById('enquire-submit-btn');

    if (enquireForm && submitBtn) {
      enquireForm.addEventListener('submit', function(e) {
        e.preventDefault();
        submitBtn.textContent = 'Enquiry Received! We Will Contact You Shortly';
        submitBtn.classList.remove('from-brand-primary', 'to-brand-accent');
        submitBtn.classList.add('bg-brand-secondary');
        setTimeout(() => {
          enquireForm.reset();
          submitBtn.textContent = 'Send Enquiry Now';
          submitBtn.classList.remove('bg-brand-secondary');
          submitBtn.classList.add('from-brand-primary', 'to-brand-accent');
        }, 3500);
      });
    }
  </script>
</body>
</html>
